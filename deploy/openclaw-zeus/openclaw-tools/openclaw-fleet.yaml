site:
  id: sitiouno-gcp
  display_name: SitioUno GCP
  assistant_identity: Soy tu asistente IA dentro de la infraestructura de SitioUno GCP.
  control_plane: hermes-agent-01
  notes:
    - Network reachability is not authority. Delegation requires an endpoint and token.
    - LLM provider traffic remains local to each office node.

offices:
  hq:
    display_name: OpenClaw HQ
    kind: gcp-office
    status: active
    gcp_project: su-office-2030
    gcp_zone: us-central1-a
    gcp_instance: openclaw-gateway-01
    gcp_internal_ip: 10.42.0.2
    tailscale_host: openclaw-hq
    tailscale_ip: 100.127.156.52
    agents:
      kaspar:
        role: hq-orchestrator
    notes:
      - HQ reverse tunnel for Sicilia has historically listened on 127.0.0.1:18780 on the HQ VM.
      - Hermes should prefer direct office delegation endpoints when available.

  sicilia:
    display_name: Sucursal Sicilia
    kind: branch-office
    status: active
    tailscale_host: openclaw-sicilia
    tailscale_ip: 100.115.198.70
    delegate_endpoint: http://100.115.198.70:8780/v1/delegate
    token_env: OPENCLAW_SICILIA_DELEGATE_TOKEN
    contract: branch-delegation-v1
    agents:
      cesar:
        role: branch-coordinator
      seneca:
        role: branch-advisor
      aurelio:
        role: worker
      tacito:
        role: worker
      ovidio:
        role: worker
      plinio:
        role: worker
      capablanca:
        role: devops-runner-registry-cron
      ana-pmo:
        role: pmo-delivery-governor
      leo-orquestador:
        role: software-factory-coordinator
      mia-producto:
        role: product-strategist
      nico-arquitecto:
        role: software-architect
      sofia-secdevops:
        role: security-devops
      dario-docs:
        role: docs-knowledge
      iris-ux:
        role: ux-frontend-quality
      rafa-cartografo:
        role: codebase-cartographer
      vera-research:
        role: research-sources
      tina-qa:
        role: technical-qa
      belen-browser:
        role: browser-qa
      clara-claude:
        role: claude-worker
      ciro-codex:
        role: codex-worker
      olga-openhands:
        role: openhands-worker
      bruno-integrador:
        role: integration-reviewer
      rene-release:
        role: release-captain
    services:
      software_factory:
        display_name: SitioUno Software Factory
        status: active
        delegate_via_office: sicilia
        coordinator_agent_id: leo-orquestador
        devops_agent_id: capablanca
        openhands_agent_id: olga-openhands
        repo: /media/jean/DATOS-SSD/sitiouno-software-factory-ai
        canonical_repo: https://github.com/SiteOneTech/sitiouno-software-factory-ai
        purpose: Planificar, implementar, validar y preparar entregables de software por agentes especializados.
    capabilities:
      - software_factory
      - openhands_worker
      - codex_worker
      - claude_worker
      - browser_qa
      - technical_qa
    repos:
      software_factory: https://github.com/SiteOneTech/sitiouno-software-factory-ai
      infra: https://github.com/sitiouno/gcloud-office
      office_ui: https://github.com/sitiouno/openclaw-office
    notes:
      - Delegate receiver speaks POST /v1/delegate with Bearer auth.
      - Gateway and Office remain local to the Sicilia node.
      - Software factory agents are delegated through the Sicilia receiver using office_id=sicilia.

  miami:
    display_name: Sucursal Miami
    kind: branch-office
    status: discovered
    tailscale_host: openclaw-miami
    tailscale_ip: 100.85.203.20
    delegate_endpoint: http://100.85.203.20:8780/v1/delegate
    token_env: OPENCLAW_MIAMI_DELEGATE_TOKEN
    contract: branch-delegation-v1
    agents: {}
    notes:
      - Tailnet node is visible. Delegation remains pending until agents and token are registered.

  mirofish:
