    gcp_internal_ip: 10.42.0.4
    tailscale_host: mirofish-simulator-01
    tailscale_ip: 100.119.34.35
    ui_url: http://100.119.34.35/
    api_base_url: http://100.119.34.35/api
    health_endpoint: http://100.119.34.35/health
    agents: {}
    notes:
      - Private GCP route is active from Hermes/HQ on port 80.
      - Browser Tailnet route is active at http://100.119.34.35/.
      - ZEP_API_KEY is configured; Zep read/write smoke test passed from the VM.
